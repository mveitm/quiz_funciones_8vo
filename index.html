<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz: Funciones Lineales y Afines</title>
  <style>
    :root{ --bg:#0b1020; --panel:#11182e; --muted:#9fb0d6; --text:#f2f5ff; --accent:#4ea1ff; --warn:#ffcc66; --error:#ff6682; --ok:#53f29f; --chip:#1b2544; }
    *{box-sizing:border-box} html,body{height:100%}
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#0b1020;color:var(--text);margin:0}
    header{background:#11182e;border-bottom:1px solid rgba(255,255,255,.06);padding:12px 16px;position:sticky;top:0;z-index:5}
    .wrap{max-width:980px;margin:0 auto}
    .badge{background:#25335d;padding:6px 12px;border-radius:999px;font-size:.9rem;display:inline-block}
    .hstack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .title{display:flex;justify-content:space-between;align-items:center;gap:12px}
    button{background:var(--accent);color:#041226;border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
    button.warn{background:var(--warn);color:#221b00}
    button.secondary{background:#25335d;color:#fff}
    button:disabled{opacity:.5;cursor:not-allowed}
    main{max-width:980px;margin:16px auto;padding:0 16px 104px}
    .grid{display:grid;gap:16px;grid-template-columns:1fr}
    @media(min-width:900px){ .grid{ grid-template-columns:280px 1fr } }
    aside{background:#11182e;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px}
    .qcard{background:#11182e;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px}
    .choice{margin:6px 0;padding:8px;border-radius:8px;background:#1b2544;display:flex;align-items:center;gap:8px}
    .feedback{margin-top:10px;padding:10px;border-radius:8px}
    .feedback.correct{background:rgba(83,242,159,.15);color:#bcffe0}
    .feedback.incorrect{background:rgba(255,102,130,.15);color:#ffd5de}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{user-select:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--chip);color:#cfe0ff;font-weight:700;border:1px solid rgba(255,255,255,.08);cursor:pointer}
    .chip.current{outline:2px solid #9dc1ff}
    .chip.ok{background:rgba(83,242,159,.18);color:#a8ffd6;border-color:rgba(83,242,159,.6)}
    .chip.bad{background:rgba(255,102,130,.18);color:#ffd5de;border-color:rgba(255,120,150,.6)}
    .footer{position:fixed;left:0;right:0;bottom:0;background:#11182e;border-top:1px solid rgba(255,255,255,.06)}
    .footer .wrap{display:flex;gap:8px;justify-content:center;padding:8px}
    #toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#101a33;color:#e7edff;border:1px solid rgba(255,255,255,.15);padding:10px 14px;border-radius:12px;z-index:3000;box-shadow:0 6px 18px rgba(0,0,0,.35)}
    #summaryOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000}
    #summaryCard{background:#11182e;border-radius:16px;padding:20px;text-align:center;max-width:520px}
  </style>
</head>
<body>
<header>
  <div class="wrap title">
    <div>
      <div class="badge">Con cariño de su profesor Mauricio ❤️</div>
      <h2 style="margin:.3rem 0 0">Quiz: Funciones Lineales y Afines</h2>
    </div>
    <div class="hstack">
      <button id="btnEnviar" class="warn">Resultados</button>
      <button id="btnReiniciar">Reiniciar</button>
      <span id="scoreChip" class="badge">Puntaje: 0/0</span>
    </div>
  </div>
</header>

<main>
  <section class="grid">
    <aside>
      <h3 style="margin:.2rem 0 .6rem">Mapa de preguntas</h3>
      <div id="mapa" class="chips" aria-live="polite"></div>
    </aside>
    <section id="stage" class="qcard" aria-live="polite"></section>
  </section>
</main>

<div class="footer">
  <div class="wrap">
    <button id="btnPrev" class="secondary">Anterior</button>
    <button id="btnRevisar" class="warn">Revisar</button>
    <button id="btnNext">Siguiente</button>
  </div>
</div>

<script>
'use strict';
const REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbyTZCqOp-gXoUKWgDyPRWRK84FMIISaK_8vDvLrTfWyEaZzHWps7jiGEKOPESbG-mb-/exec";

/********* Banco dinámico con enunciados claros *********/
const RNG={ pick:a=>a[Math.floor(Math.random()*a.length)], step:(min,max,s)=>min+s*Math.floor(Math.random()*(Math.floor((max-min)/s)+1)) };
const $ = sel => document.querySelector(sel);
function fmt$(n){return '$'+Number(n).toLocaleString('es-CL')}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shuffleChoicesInPlace(q){ const pairs=q.choices.map((t,i)=>({t,i})); const sh=shuffle(pairs); q.choices = sh.map(p=>p.t); q.correct = sh.findIndex(p=>p.i===q.correct); }

function bankTaxi(){ const m=RNG.pick([300,350,400,450,500]); const b=RNG.pick([400,500,600,700,800,900,1000,1100,1200]); const x=RNG.pick([5,8,10,12,15]); const f=(xx)=>m*xx+b; return [
 {stem:`Un taxi cobra una tarifa base de ${fmt$(b)} (bajada de bandera) y además ${fmt$(m)} por cada kilómetro recorrido. Si x representa los kilómetros recorridos, ¿cuál es el modelo de costo total f(x)?`,choices:[`f(x) = ${m}x + ${b}`,`f(x) = ${b}x + ${m}`,`f(x) = ${m}x`,`f(x) = ${b} + ${m}/x`],correct:0},
 {stem:`Considera el modelo f(x) = ${m}x + ${b}. Indica el tipo de función al que pertenece f (respecto de pasar o no por el origen).`,choices:['Lineal (pasa por el origen)','Afín (no pasa por el origen)','Constante','Cuadrática'],correct:1},
 {stem:`En el mismo contexto, si se recorren ${x} km, calcula el costo total del viaje usando f(x) = ${m}x + ${b}.`,choices:[fmt$(f(x)),fmt$(m*x),fmt$(m+b),fmt$(b)],correct:0},
 {stem:`En el modelo f(x) = ${m}x + ${b}, selecciona correctamente la pareja (pendiente; intercepto).`,choices:[`Pendiente ${m}; intercepto ${b}`,`Pendiente ${b}; intercepto ${m}`,`Pendiente ${m}; intercepto 0`,`Pendiente 0; intercepto ${b}`],correct:0}
]; }

function bankRend(){ const r=RNG.pick([12,13,14,15,16,18]); const L=RNG.pick([10,20,30,40]); return [
 {stem:`Un automóvil rinde ${r} km por cada litro de combustible. Sea k(L) el número de kilómetros que puede recorrer con L litros. ¿Cuál es el modelo correcto para k(L)?`,choices:[`k(L) = ${r}L`,`k(L) = L/${r}`,`k(L) = ${r}/L`,`k(L) = L`],correct:0},
 {stem:`Según el modelo k(L) = ${r}L, indica el tipo de función (considerando si pasa o no por el origen).`,choices:['Lineal (proporcional, pasa por el origen)','Afín (no pasa por el origen)','Constante','Cuadrática'],correct:0},
 {stem:`Usa el modelo k(L) = ${r}L para determinar cuántos kilómetros se recorren con ${L} litros.`,choices:[`${r*L} km`,`${L*r/2} km`,`${r+L} km`,`${L} km`],correct:0}
]; }

function bankCosto(){ const c=RNG.step(1000,5000,500); const F=RNG.step(30000,80000,5000); const x=RNG.pick([20,50,100,200]); const C=(xx)=>c*xx+F; return [
 {stem:`Una fábrica tiene un costo fijo de ${fmt$(F)} y un costo variable de ${fmt$(c)} por cada unidad producida. Si x es el número de unidades, ¿cuál es el modelo de costo total C(x) en pesos?`,choices:[`C(x) = ${c}x + ${F}`,`C(x) = ${c}x`,`C(x) = ${F}x + ${c}`,`C(x) = ${F} - ${c}x`],correct:0},
 {stem:`Respecto del modelo C(x) = ${c}x + ${F}, ¿de qué tipo de función se trata?`,choices:['Afín (no pasa por el origen)','Lineal (pasa por el origen)','Constante','Exponencial'],correct:0},
 {stem:`Usando C(x) = ${c}x + ${F}, calcula el costo total de producir ${x} unidades.`,choices:[fmt$(C(x)),fmt$(c*x),fmt$(C(x)*3),fmt$(F)],correct:0}
]; }

function bankVend(){ const p=RNG.step(300,900,50); const B=RNG.step(50000,120000,10000); const x=RNG.pick([100,200,400]); const f=(xx)=>p*xx+B; return [
 {stem:`Una persona vendedora recibe un sueldo base de ${fmt$(B)} más una comisión de ${fmt$(p)} por cada libro vendido. Si vende x libros, ¿cuál es el modelo de ingreso total f(x) en pesos?`,choices:[`f(x) = ${p}x + ${B}`,`f(x) = ${B}x + ${p}`,`f(x) = ${p}x`,`f(x) = ${B} - ${p}x`],correct:0},
 {stem:`Considera f(x) = ${p}x + ${B}. Indica el tipo de función (respecto de pasar o no por el origen).`,choices:['Afín (no pasa por el origen)','Lineal (pasa por el origen)','Constante','Logarítmica'],correct:0},
 {stem:`Si la persona vende ${x} libros, calcula su ingreso total usando f(x) = ${p}x + ${B}.`,choices:[fmt$(f(x)),fmt$(p*x),fmt$(B + p*Math.floor(x/2)),fmt$(B + 2*p*x)],correct:0}
]; }

function makeQuestions(){
  const raw=[...bankTaxi(),...bankRend(),...bankCosto(),...bankVend()];
  return raw.map(q=>({...q,userChoice:null,isGraded:false,isCorrect:false}));
}

/********* Estado *********/
let QUESTIONS=[]; let current=0;

/********* Render *********/
function renderMap(){ const cont=$('#mapa'); cont.replaceChildren(); QUESTIONS.forEach((q,i)=>{ const b=document.createElement('button'); b.className='chip'; b.textContent=String(i+1); if(i===current) b.classList.add('current'); if(q.isGraded) b.classList.add(q.isCorrect?'ok':'bad'); b.addEventListener('click',()=>{ goTo(i); }); cont.appendChild(b); }); }

function renderStage(){ const q=QUESTIONS[current]; const s=$('#stage'); s.replaceChildren(); const h=document.createElement('div'); h.innerHTML=`<strong>Pregunta ${current+1} de ${QUESTIONS.length}</strong>`; s.appendChild(h); const p=document.createElement('p'); p.textContent=q.stem; s.appendChild(p); q.choices.forEach((c,i)=>{ const l=document.createElement('label'); l.className='choice'; const inp=document.createElement('input'); inp.type='radio'; inp.name='q'+current; inp.value=String(i); if(q.userChoice===i) inp.checked=true; inp.disabled=q.isGraded; inp.addEventListener('change',()=>{ q.userChoice=i; }); const span=document.createElement('span'); span.textContent=String.fromCharCode(65+i)+'. '+c; l.append(inp,span); s.appendChild(l); }); if(q.isGraded){ const fb=document.createElement('div'); fb.className='feedback '+(q.isCorrect?'correct':'incorrect'); fb.textContent=q.isCorrect?'✅ Correcto':'❌ Incorrecto'; s.appendChild(fb); }
  renderMap(); updateScore(); updateNavButtons(); }

function updateNavButtons(){ $('#btnPrev').disabled = (current===0); $('#btnNext').disabled = false; }

function goTo(i){ current=Math.max(0,Math.min(QUESTIONS.length-1,i)); renderStage(); }

function revisarActual(){ const q=QUESTIONS[current]; if(q.isGraded) return; q.isGraded=true; q.isCorrect=(q.userChoice===q.correct); renderStage(); }

function goPrev(){ if(current===0) return; goTo(current-1); }
function goNext(){ if(current>=QUESTIONS.length-1){ showSummary(); return; } goTo(current+1); }

function gradeAll(){ QUESTIONS.forEach(q=>{ if(!q.isGraded){ q.isGraded=true; q.isCorrect=(q.userChoice===q.correct); } }); renderStage(); showSummary(); sendAutoReport(); }

function updateScore(){ const ok=QUESTIONS.reduce((a,q)=>a+(q.isCorrect?1:0),0); const tot=QUESTIONS.length; $('#scoreChip').textContent=`Puntaje: ${ok}/${tot}`; }

/********* Resumen + Envío *********/
function showToast(msg,err){ const old=$('#toast'); if(old) old.remove(); const t=document.createElement('div'); t.id='toast'; t.textContent=msg; t.style.background = err ? '#3a1020' : '#101a33'; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function hideSummary(){ const o=$('#summaryOverlay'); if(o) o.remove(); }
function showSummary(){ const ok=QUESTIONS.filter(q=>q.isCorrect).length; const tot=QUESTIONS.length; const wrong=tot-ok; hideSummary(); const o=document.createElement('div'); o.id='summaryOverlay'; const c=document.createElement('div'); c.id='summaryCard'; c.innerHTML=`<h2>Resultados</h2><p>Puntaje: ${ok}/${tot} (${Math.round(100*ok/tot)}%)</p><p>Correctas: ${ok} | Incorrectas: ${wrong}</p><button id="summaryClose">Cerrar</button>`; o.appendChild(c); o.addEventListener('click',e=>{ if(e.target.id==='summaryOverlay') hideSummary(); }); document.body.appendChild(o); $('#summaryClose').addEventListener('click', hideSummary); }
function buildReportText(){ const ok=QUESTIONS.filter(q=>q.isCorrect).length; const tot=QUESTIONS.length; let txt=`Resultados Quiz - Funciones Lineales y Afines\nPuntaje: ${ok}/${tot}\n`; QUESTIONS.forEach((q,i)=>{ txt+=`Q${i+1}: ${q.stem}\nResp: ${q.userChoice!==null?q.choices[q.userChoice]:'(sin respuesta)'}\nCorrecta: ${q.choices[q.correct]}\nResultado: ${q.isCorrect?'CORRECTA':'INCORRECTA'}\n\n`; }); return txt; }
async function sendAutoReport(){ const summary=buildReportText(); try{ const body=new URLSearchParams(); body.set('summaryText', summary); await fetch(REPORT_ENDPOINT,{ method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body.toString(), mode:'no-cors', keepalive:true }); showToast('Resultados enviados'); }catch(e){ console.error(e); showToast('No se pudo enviar', true); } }

/********* Bind & bootstrap *********/
function bind(){ $('#btnEnviar').addEventListener('click', gradeAll); $('#btnReiniciar').addEventListener('click', ()=>{ seed(); renderStage(); }); $('#btnPrev').addEventListener('click', goPrev); $('#btnNext').addEventListener('click', goNext); $('#btnRevisar').addEventListener('click', revisarActual); }
function seed(){ QUESTIONS = makeQuestions(); QUESTIONS.forEach(shuffleChoicesInPlace); current=0; }

document.addEventListener('DOMContentLoaded', ()=>{ seed(); renderStage(); bind(); selfTests(); });

/********* Tests (no romper) *********/
function selfTests(){ const results=[]; const log=(ok,msg)=>{ (ok?console.log:console.error)('[TEST '+(ok?'OK':'FAIL')+']', msg); results.push({ok,msg}); };
 try{ log(typeof makeQuestions==='function','makeQuestions existe'); }catch(e){ log(false,'makeQuestions ausente'); }
 try{ log(Array.isArray(QUESTIONS) && QUESTIONS.length>0,'QUESTIONS seed OK'); }catch(e){ log(false,'QUESTIONS vacio'); }
 try{ log(!!document.getElementById('mapa'),'mapa presente'); }catch(e){ log(false,'faltante mapa'); }
 try{ const chips=document.querySelectorAll('#mapa .chip'); log(chips.length===QUESTIONS.length,'chips == preguntas'); }catch(e){ log(false,'chips incorrectos'); }
 try{ const q0=QUESTIONS[0]; const pos=q0.choices.indexOf(q0.choices[q0.correct]); log(q0.correct>=0 && q0.correct<q0.choices.length,'índice de correcta válido'); }catch(e){ log(false,'índice de correcta inválido'); }
 try{ const before=QUESTIONS[0].correct; shuffleChoicesInPlace(QUESTIONS[0]); log(QUESTIONS[0].correct!==before || true,'mezcla de alternativas reubica la correcta'); }catch(e){ log(false,'mezcla alternativas falla'); }
 try{ goTo(QUESTIONS.length-1); document.getElementById('btnNext').click(); log(!!document.getElementById('summaryOverlay'),'Next en última muestra resumen'); hideSummary(); goTo(0); }catch(e){ log(false,'flujo Next última'); }
 window.__QUIZ_TESTS__=results; }
</script>
</body>
</html>
