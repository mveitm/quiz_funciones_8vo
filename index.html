<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz: Funciones Lineales y Afines</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#0b1020;color:#fff;margin:0;padding:0}
    header{background:#11182e;padding:10px 16px;position:sticky;top:0;z-index:5}
    .badge{background:#25335d;padding:6px 12px;border-radius:999px;font-size:.9rem}
    button{background:#4ea1ff;color:#041226;border:0;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;margin:4px}
    button.warn{background:#ffcc66;color:#221b00}
    button.secondary{background:#25335d;color:#fff}
    .qcard{margin:16px;padding:16px;background:#11182e;border-radius:12px}
    .choice{margin:6px 0;padding:6px;border-radius:8px;background:#1b2544;display:flex;align-items:center;gap:6px}
    .feedback{margin-top:10px;padding:10px;border-radius:8px}
    .feedback.correct{background:rgba(83,242,159,.15);color:#bcffe0}
    .feedback.incorrect{background:rgba(255,102,130,.15);color:#ffd5de}
    #toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#101a33;color:#e7edff;border:1px solid rgba(255,255,255,.15);padding:10px 14px;border-radius:12px;z-index:3000;box-shadow:0 6px 18px rgba(0,0,0,.35)}
    #summaryOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000}
    #summaryCard{background:#11182e;border-radius:16px;padding:20px;text-align:center;max-width:420px}
  </style>
</head>
<body>
<header>
  <div class="badge">Con cariño de su profesor Mauricio ❤️</div>
  <h2>Quiz: Funciones Lineales y Afines</h2>
  <button id="btnEnviar" class="warn">Resultados</button>
  <button id="btnReiniciar">Reiniciar</button>
  <span id="scoreChip" class="badge">Puntaje: 0/0</span>
</header>

<main>
  <section id="stage" class="qcard"></section>
  <div style="position:fixed;bottom:0;left:0;right:0;padding:8px;background:#11182e;display:flex;justify-content:center;gap:8px">
    <button id="btnPrev" class="secondary">Anterior</button>
    <button id="btnRevisar" class="warn">Revisar</button>
    <button id="btnNext">Siguiente</button>
  </div>
</main>

<script>
'use strict';
const REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbyTZCqOp-gXoUKWgDyPRWRK84FMIISaK_8vDvLrTfWyEaZzHWps7jiGEKOPESbG-mb-/exec";
let QUESTIONS=[];let current=0;
function RNGpick(a){return a[Math.floor(Math.random()*a.length)]}
function genBank(){return[{stem:'f(x)=3x+2 ¿Cuál es el tipo de función?',choices:['Lineal','Afín','Constante','Cuadrática'],correct:1},{stem:'En f(x)=5x la pendiente es...',choices:['5','x','0','1/5'],correct:0},{stem:'f(x)=2x+4 ¿Cuál es el valor de f(3)?',choices:['10','8','6','12'],correct:0}].map(q=>({...q,userChoice:null,isGraded:false,isCorrect:false}))}
function seedQuiz(){QUESTIONS=genBank()}
function renderStage(){const q=QUESTIONS[current];const s=document.getElementById('stage');s.innerHTML=`<div><strong>Pregunta ${current+1} de ${QUESTIONS.length}</strong><p>${q.stem}</p></div>`;q.choices.forEach((c,i)=>{const l=document.createElement('label');l.className='choice';l.innerHTML=`<input type="radio" name="q${current}" value="${i}">${String.fromCharCode(65+i)}. ${c}`;if(q.userChoice===i)l.querySelector('input').checked=true;l.querySelector('input').onchange=()=>q.userChoice=i;s.appendChild(l)});if(q.isGraded){const fb=document.createElement('div');fb.className='feedback '+(q.isCorrect?'correct':'incorrect');fb.innerHTML=q.isCorrect?'✅ Correcto':'❌ Incorrecto';s.appendChild(fb)}}
function revisarActual(){const q=QUESTIONS[current];if(q.isGraded)return;q.isGraded=true;q.isCorrect=q.userChoice===q.correct;renderStage()}
function gradeAll(){QUESTIONS.forEach(q=>{if(!q.isGraded){q.isGraded=true;q.isCorrect=q.userChoice===q.correct}});renderStage();updateScore();showSummary();sendAutoReport()}
function goTo(i){current=Math.max(0,Math.min(QUESTIONS.length-1,i));renderStage()}
function updateScore(){const ok=QUESTIONS.filter(q=>q.isCorrect).length;document.getElementById('scoreChip').textContent=`Puntaje: ${ok}/${QUESTIONS.length}`}
function showSummary(){const ok=QUESTIONS.filter(q=>q.isCorrect).length;const tot=QUESTIONS.length;const wrong=tot-ok;const o=document.createElement('div');o.id='summaryOverlay';const c=document.createElement('div');c.id='summaryCard';c.innerHTML=`<h2>Resultados</h2><p>Puntaje: ${ok}/${tot}</p><p>Correctas: ${ok} | Incorrectas: ${wrong}</p><button onclick="this.closest('#summaryOverlay').remove()">Cerrar</button>`;o.appendChild(c);o.onclick=e=>{if(e.target.id==='summaryOverlay')o.remove()};document.body.appendChild(o)}
function showToast(msg,err){const old=document.getElementById('toast');if(old)old.remove();const t=document.createElement('div');t.id='toast';t.textContent=msg;t.style.background=err?'#3a1020':'#101a33';document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function buildReportText(){const ok=QUESTIONS.filter(q=>q.isCorrect).length;const tot=QUESTIONS.length;let txt=`Resultados Quiz - Funciones Lineales y Afines\nPuntaje: ${ok}/${tot}\n`;QUESTIONS.forEach((q,i)=>{txt+=`Q${i+1}: ${q.stem}\nResp: ${q.userChoice!==null?q.choices[q.userChoice]:'(sin respuesta)'}\nCorrecta: ${q.choices[q.correct]}\nResultado: ${q.isCorrect?'CORRECTA':'INCORRECTA'}\n\n`});return txt}
async function sendAutoReport(){const summary=buildReportText();try{const body=new URLSearchParams();body.set('summaryText',summary);await fetch(REPORT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString(),mode:'no-cors',keepalive:true});showToast('Resultados enviados');}catch(e){console.error(e);showToast('No se pudo enviar',true)}}
function bind(){document.getElementById('btnEnviar').onclick=gradeAll;document.getElementById('btnReiniciar').onclick=()=>{seedQuiz();current=0;renderStage()};document.getElementById('btnPrev').onclick=()=>goTo(current-1);document.getElementById('btnNext').onclick=()=>goTo(current+1);document.getElementById('btnRevisar').onclick=revisarActual}
document.addEventListener('DOMContentLoaded',()=>{seedQuiz();renderStage();bind()});
</script>
</body>
</html>
