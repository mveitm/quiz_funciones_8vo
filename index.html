<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz: Funciones Lineales y Afines</title>
  <style>
    :root{ --bg:#0b1020; --panel:#11182e; --muted:#7f8db2; --text:#f2f5ff; --accent:#4ea1ff; --warn:#ffcc66; --error:#ff6682; --ok:#53f29f; --chip:#1b2544; }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica Neue,Arial; background: radial-gradient(1200px 800px at 20% -10%, #1a2453, transparent 60%), radial-gradient(1000px 700px at 120% 10%, #103a5a, transparent 40%), var(--bg); color:var(--text); line-height:1.4; }
    header{ position:sticky; top:0; z-index:5; backdrop-filter:saturate(1.1) blur(6px); background:linear-gradient(180deg, rgba(17,24,46,.9), rgba(17,24,46,.7)); border-bottom:1px solid rgba(255,255,255,.06) }
    .wrap{max-width:980px; margin:0 auto; padding:12px 16px}
    .title{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
    .badge{font-size:.85rem; padding:6px 12px; border-radius:999px; background:#25335d; color:var(--text)}
    .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:center}
    .input{background:#1b2544; color:var(--text); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:10px 12px; min-width:240px}
    button{background:var(--accent); color:#041226; border:0; padding:10px 14px; border-radius:12px; font-weight:700; cursor:pointer}
    button.secondary{background:#25335d; color:var(--text)}
    button.warn{background:#ffcc66; color:#221b00}
    button:disabled{opacity:.55; cursor:not-allowed}

    main{max-width:980px; margin:18px auto; padding:0 16px 96px}
    .panel{background:rgba(17,24,46,.7); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.25)}

    .grid{display:grid; gap:16px; grid-template-columns:1fr}
    @media(min-width:900px){ .grid{ grid-template-columns: 300px 1fr; } }

    .mapa{display:flex; flex-wrap:wrap; gap:8px}
    .chip{user-select:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px; background:var(--chip); color:var(--muted); font-weight:700; border:1px solid rgba(255,255,255,.08)}
    .chip.current{outline:2px solid #9dc1ff}
    .chip.correct{background:rgba(83,242,159,.18); color:var(--ok); border-color:rgba(83,242,159,.6)}
    .chip.incorrect{background:rgba(255,102,130,.15); color:var(--error); border-color:rgba(255,255,255,.5)}

    .qcard{background:rgba(12,18,36,.6); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:16px}
    .qhead{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
    .qnum{font-weight:800; color:#d3ddff}
    .qctx{margin-left:auto; display:flex; gap:8px}
    .ctx{font-size:.72rem; padding:4px 8px; border-radius:999px; background:#1c2a4f; color:#b2c3ff}
    .skill{font-size:.72rem; padding:4px 8px; border-radius:999px; background:#1a3a30; color:#8fffcb}
    .stem{margin:10px 0}

    .choices{display:grid; gap:8px}
    .choice{background:rgba(21,28,50,.85); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:10px; display:flex; gap:10px; align-items:flex-start}
    .choice input{margin-top:4px; transform:scale(1.15)}
    .letter{width:26px; height:26px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; background:#172142; color:#b9c8ff; flex:0 0 26px}

    .feedback{margin-top:10px; padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,.08)}
    .feedback.correct{background:rgba(83,242,159,.15); border-color:rgba(83,242,159,.6); color:#bcffe0}
    .feedback.incorrect{background:rgba(255,102,130,.15); border-color:rgba(255,102,130,.6); color:#ffd5de}

    .footer-actions{position:fixed; bottom:0; left:0; right:0; background:linear-gradient(180deg, rgba(17,24,46,.1), rgba(17,24,46,.9)); backdrop-filter: blur(6px); border-top:1px solid rgba(255,255,255,.08); z-index:1000}
    .footer-actions .wrap{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

    .modal-ov{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:1500}
    .modal{background:var(--panel); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:20px; max-width:520px; width:92%}
    .modal h3{margin:0 0 10px 0}
    .stat{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,.15)}
    .stat:last-child{border-bottom:0}
    .modal .input{width:100%; margin-top:10px}
    .modal .actions{display:flex; gap:8px; justify-content:flex-end; margin-top:14px}

    @media print{ header, .footer-actions, .modal-ov{display:none} body{background:#fff; color:#000} .panel, .qcard{background:#fff; color:#000; border-color:#888} .chip{border:1px solid #000} }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="title">
        <div>
          <div class="badge">Con cariño de su profesor Mauricio ❤️</div>
          <h1 style="margin:.2rem 0 0">Quiz: Funciones Lineales y Afines</h1>
        </div>
      </div>
      <div class="btns">
        <button class="warn" id="btnEnviar">Resultados</button>
        <button id="btnReiniciar">Reiniciar</button>
        <span id="scoreChip" class="badge" aria-live="polite">Puntaje: —</span>
      </div>
    </div>
  </header>

  <main>
    <section class="grid">
      <aside class="panel">
        <h3 style="margin-top:0">Mapa de preguntas</h3>
        <div id="mapa" class="mapa" aria-live="polite"></div>
      </aside>
      <section id="stage" class="qcard" aria-live="polite" style="min-height:300px"></section>
    </section>
  </main>

  <div class="footer-actions">
    <div class="wrap">
      <button id="btnPrev" class="secondary">Anterior</button>
      <button id="btnRevisar" class="warn">Revisar</button>
      <button id="btnNext">Siguiente</button>
    </div>
  </div>

  <div id="modalOv" class="modal-ov" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 id="modalTitle">Resumen de resultados</h3>
      <div id="modalBody"></div>
      <div class="actions">
        <input id="studentName" class="input" type="text" placeholder="Nombre del estudiante" />
        <button id="btnSend">Enviar al profesor</button>
        <button id="btnWA">WhatsApp</button>
        <button id="btnSMS">SMS</button>
        <button id="btnCopy">Copiar</button>
        <button id="btnCloseModal">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
  'use strict';
  const RNG={ pick:a=>a[Math.floor(Math.random()*a.length)], randStep(min,max,step){const n=Math.floor((max-min)/step);return min+step*Math.floor(Math.random()*(n+1));} };
  const fmtMoney=n=>`$${n.toLocaleString('es-CL')}`;

  let actx; function getAC(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); } return actx; }
  function tone({freq=440,dur=0.12,type='sine',gain=0.06}){ const ac=getAC(); const o=ac.createOscillator(); const g=ac.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=gain; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur); }
  function seq(notes){ const ac=getAC(); let t=ac.currentTime; notes.forEach(n=>{ const o=ac.createOscillator(); const g=ac.createGain(); o.type=n.type||'sine'; o.frequency.value=n.freq; g.gain.value=n.gain||0.06; o.connect(g); g.connect(ac.destination); o.start(t+(n.delay||0)); o.stop(t+(n.delay||0)+n.dur); }); }
  const SFX={ click:()=>tone({freq:260,dur:0.06,type:'triangle'}), select:()=>tone({freq:330,dur:0.05,type:'square'}), correct:()=>seq([{freq:620,dur:.08},{freq:740,dur:.08,delay:.08},{freq:880,dur:.12,delay:.16,type:'triangle',gain:.07}]), incorrect:()=>seq([{freq:220,dur:.15,type:'sawtooth',gain:.07},{freq:180,dur:.18,delay:.12,type:'sawtooth',gain:.06}]) };
  function wireSfx(){ document.addEventListener('click',e=>{ if(e.target.closest('button')) SFX.click(); }); }

  function genTaxi(){ const m=RNG.pick([300,350,400,450,500]); const b=RNG.pick([400,500,600,700,800,900,1000,1100,1200]); const x=RNG.pick([5,8,10,12,15]); const f=xx=>m*xx+b; return [
    { id:`TX-1-${m}-${b}`, context:'Taxi', skill:'Modelo', stem:`Un taxi cobra ${fmtMoney(b)} de bajada y ${fmtMoney(m)} por kilómetro. ¿Cuál es el modelo del costo total f(x)?`, choices:[`f(x) = ${m}x + ${b}`,`f(x) = ${b}x + ${m}`,`f(x) = ${m}x`,`f(x) = ${b} + ${m}/x`], correct:0, explanation:`Pendiente = ${fmtMoney(m)} por km; intercepto = ${fmtMoney(b)}.`},
    { id:`TX-2-${m}-${b}`, context:'Taxi', skill:'Tipo', stem:`Para f(x) = ${m}x + ${b}, el tipo de función es…`, choices:['Lineal (pasa por el origen)','Afín (no pasa por el origen)','Constante','Cuadrática'], correct:1, explanation:`Tiene término independiente ${fmtMoney(b)} ≠ 0; es afín.`},
    { id:`TX-3-${m}-${b}-${x}`, context:'Taxi', skill:'Cálculo', stem:`¿Cuánto cuesta un viaje de ${x} km si f(x) = ${m}x + ${b}?`, choices:[fmtMoney(f(x)),fmtMoney(m*x),fmtMoney(m+b),fmtMoney(b)], correct:0, explanation:`f(${x}) = ${m}·${x} + ${b} = ${fmtMoney(m*x)} + ${fmtMoney(b)} = ${fmtMoney(f(x))}.`},
    { id:`TX-4-${m}-${b}`, context:'Taxi', skill:'Parámetros', stem:`En f(x) = ${m}x + ${b}, ¿cuál es (pendiente; intercepto)?`, choices:[`Pendiente ${m}; Intercepto ${b}`,`Pendiente ${b}; Intercepto ${m}`,`Pendiente ${m}; Intercepto 0`,`Pendiente 0; Intercepto ${b}`], correct:0, explanation:`Pendiente = ${m}; Intercepto = ${b}.`}
  ]; }

  function genBencina(){ const r=RNG.pick([12,13,14,15,16,18]); const L=RNG.pick([10,20,30,40]); return [
    { id:`BK-1-${r}`, context:'Bencina', skill:'Modelo', stem:`Un auto rinde ${r} km por litro. Sea k(ℓ) los km con ℓ litros. ¿Cuál es el modelo correcto?`, choices:[`k(ℓ) = ${r}ℓ`,`k(ℓ) = ℓ/${r}`,`k(ℓ) = ${r}/ℓ`,`k(ℓ) = ℓ`], correct:0, explanation:`Si por cada litro recorre ${r} km, con ℓ litros recorre ${r}·ℓ.`},
    { id:`BK-2-${r}`, context:'Bencina', skill:'Tipo', stem:`La función k(ℓ) = ${r}ℓ es…`, choices:['Lineal (proporcional, pasa por el origen)','Afín (no pasa por el origen)','Constante','Cuadrática'], correct:0, explanation:`Es de la forma m·x con intercepto 0; por tanto, lineal.`},
    { id:`BK-3-${r}-${L}`, context:'Bencina', skill:'Cálculo', stem:`¿Cuántos km recorre con ${L} L si k(ℓ) = ${r}ℓ?`, choices:[`${r*L} km`,`${L*r/2} km`,`${r+L} km`,`${L} km`], correct:0, explanation:`k(${L}) = ${r}·${L} = ${r*L} km.`},
    { id:`BK-4-${r}`, context:'Bencina', skill:'Parámetros', stem:`En k(ℓ) = ${r}ℓ, el (pendiente; intercepto) es…`, choices:[`Pendiente ${r}; Intercepto 0`,`Pendiente 0; Intercepto ${r}`,`Pendiente 1/${r}; Intercepto 0`,`Pendiente ${r}; Intercepto 600`], correct:0, explanation:`Pendiente = ${r}; Intercepto = 0.`}
  ]; }

  function genMaquina(){ const c=RNG.randStep(1000,5000,500); const F=RNG.randStep(30000,80000,5000); const x=RNG.pick([20,50,100,200]); const C=xx=>c*xx+F; return [
    { id:`MA-1-${c}-${F}`, context:'Máquina', skill:'Modelo', stem:`Una máquina tiene costo fijo de ${fmtMoney(F)} más ${fmtMoney(c)} por unidad. ¿Cuál es el costo total C(x)?`, choices:[`C(x) = ${c}x + ${F}`,`C(x) = ${c}x`,`C(x) = ${F}x + ${c}`,`C(x) = ${F} − ${c}x`], correct:0, explanation:`Variable ${fmtMoney(c)} por unidad y fijo ${fmtMoney(F)}.`},
    { id:`MA-2-${c}-${F}`, context:'Máquina', skill:'Tipo', stem:`Para C(x) = ${c}x + ${F}, la función es…`, choices:['Afín (no pasa por el origen)','Lineal (pasa por el origen)','Constante','Exponencial'], correct:0, explanation:`Tiene término independiente ${fmtMoney(F)} ≠ 0.`},
    { id:`MA-3-${c}-${F}-${x}`, context:'Máquina', skill:'Cálculo', stem:`¿Cuál es el costo de producir ${x} unidades si C(x) = ${c}x + ${F}?`, choices:[fmtMoney(C(x)),fmtMoney(c*x),fmtMoney(C(x)*3),fmtMoney(F)], correct:0, explanation:`C(${x}) = ${c}·${x} + ${F} = ${fmtMoney(c*x)} + ${fmtMoney(F)} = ${fmtMoney(C(x))}.`},
    { id:`MA-4-${c}-${F}`, context:'Máquina', skill:'Parámetros', stem:`En C(x) = ${c}x + ${F}, el (pendiente; intercepto) es…`, choices:[`Pendiente ${c}; Intercepto ${F}`,`Pendiente ${F}; Intercepto ${c}`,`Pendiente ${c}; Intercepto 0`,`Pendiente 0; Intercepto ${F}`], correct:0, explanation:`Pendiente = ${c}; Intercepto = ${F}.`}
  ]; }

  function genVendedor(){ const p=RNG.randStep(300,900,50); const B=RNG.randStep(50000,120000,10000); const x=RNG.pick([100,200,400]); const f=xx=>p*xx+B; return [
    { id:`VE-1-${p}-${B}`, context:'Vendedor', skill:'Modelo', stem:`Un vendedor recibe sueldo base de ${fmtMoney(B)} más ${fmtMoney(p)} por libro. ¿Cuál es su ingreso f(x)?`, choices:[`f(x) = ${p}x + ${B}`,`f(x) = ${B}x + ${p}`,`f(x) = ${p}x`,`f(x) = ${B} − ${p}x`], correct:0, explanation:`Comisión ${fmtMoney(p)} (pendiente) y base ${fmtMoney(B)} (intercepto).`},
    { id:`VE-2-${p}-${B}`, context:'Vendedor', skill:'Tipo', stem:`Según f(x) = ${p}x + ${B}, la función es…`, choices:['Afín (no pasa por el origen)','Lineal (pasa por el origen)','Constante','Logarítmica'], correct:0, explanation:`Tiene término independiente ${fmtMoney(B)} ≠ 0.`},
    { id:`VE-3-${p}-${B}-${x}`, context:'Vendedor', skill:'Cálculo', stem:`¿Cuánto ganará si vende ${x} libros? Usa f(x) = ${p}x + ${B}.`, choices:[fmtMoney(f(x)),fmtMoney(B + p*Math.floor(x/2)),fmtMoney(p*x),fmtMoney(B + 2*p*x)], correct:0, explanation:`f(${x}) = ${p}·${x} + ${B} = ${fmtMoney(p*x)} + ${fmtMoney(B)} = ${fmtMoney(f(x))}.`},
    { id:`VE-4-${p}-${B}`, context:'Vendedor', skill:'Parámetros', stem:`Para f(x) = ${p}x + ${B}, (pendiente; intercepto) es…`, choices:[`Pendiente ${p}; Intercepto ${B}`,`Pendiente ${B}; Intercepto ${p}`,`Pendiente ${p}; Intercepto 0`,`Pendiente 0; Intercepto ${B}`], correct:0, explanation:`Pendiente = ${p}; Intercepto = ${B}.`}
  ]; }

  function buildBank(){ return [...genTaxi(),...genBencina(),...genMaquina(),...genVendedor()].map(q=>({...q, choices:q.choices.map((t,i)=>({text:t, correct:i===q.correct}))})); }

  let QUESTIONS=[]; let current=0;
  function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }
  function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

  function seedQuiz(){ QUESTIONS=shuffle(buildBank().map(q=>({...deepCopy(q), userChoice:null, isGraded:false, isCorrect:false }))); QUESTIONS.forEach(q=>{ q.choices=shuffle(q.choices); }); }

  function renderMap(){ const map=document.getElementById('mapa'); map.replaceChildren(); QUESTIONS.forEach((q,idx)=>{ const chip=document.createElement('button'); chip.type='button'; chip.className='chip'; chip.id=`chip_${idx}`; chip.textContent=idx+1; if(q.isGraded){ chip.classList.add(q.isCorrect?'correct':'incorrect'); } if(idx===current){ chip.classList.add('current'); } chip.addEventListener('click',()=>{ SFX.click(); goTo(idx); }); map.appendChild(chip); }); }

  function renderStage(){ const q=QUESTIONS[current]; const stage=document.getElementById('stage'); stage.replaceChildren();
    const head=document.createElement('div'); head.className='qhead';
    const left=document.createElement('div'); left.className='qnum'; left.textContent=`Pregunta ${current+1} de ${QUESTIONS.length}`;
    const qctx=document.createElement('div'); qctx.className='qctx';
    const ctx=document.createElement('span'); ctx.className='ctx'; ctx.textContent=q.context;
    const skill=document.createElement('span'); skill.className='skill'; skill.textContent=q.skill;
    qctx.append(ctx, skill); head.append(left, qctx); stage.append(head);

    const stem=document.createElement('div'); stem.className='stem'; stem.textContent=q.stem; stage.append(stem);

    const choices=document.createElement('div'); choices.className='choices';
    q.choices.forEach((c,cidx)=>{
      const row=document.createElement('label'); row.className='choice';
      const letter=document.createElement('span'); letter.className='letter'; letter.textContent=String.fromCharCode(65+cidx);
      const input=document.createElement('input'); input.type='radio'; input.name=`q_${current}`; input.value=String(cidx); input.disabled=q.isGraded; if(q.userChoice===cidx) input.checked=true; input.addEventListener('change', ()=>{ QUESTIONS[current].userChoice=cidx; SFX.select(); });
      const ctext=document.createElement('div'); ctext.className='ctext'; ctext.textContent=c.text;
      row.append(letter, input, ctext); choices.append(row);
    });
    stage.append(choices);

    if(q.isGraded){
      const box=document.createElement('div'); box.className='feedback '+(q.isCorrect?'correct':'incorrect');
      const strong=document.createElement('strong'); strong.textContent=q.isCorrect? '¡Correcto!':'Incorrecto';
      const p1=document.createElement('div'); p1.innerHTML='<span class="muted">Tu respuesta:</span> ' + (q.userChoice!==null? q.choices[q.userChoice].text : '<em>sin responder</em>');
      const p2=document.createElement('div'); p2.innerHTML='<span class="muted">Correcta:</span> ' + q.choices.find(c=>c.correct).text;
      const p3=document.createElement('div'); p3.style.marginTop='6px'; p3.textContent=q.explanation;
      box.append(strong, p1, p2, p3); stage.append(box);
    }

    renderMap(); updateScoreChip();
  }

  function goTo(idx){ current=Math.max(0, Math.min(QUESTIONS.length-1, idx)); renderStage(); }
  function getSelected(){ const checked=document.querySelector('input[name=q_'+current+']:checked'); return checked? parseInt(checked.value,10):null; }

  function revisarActual(){ const q=QUESTIONS[current]; if(q.isGraded) return; const sel=getSelected(); q.userChoice=sel; q.isGraded=true; q.isCorrect=(sel!==null)&&!!q.choices[sel]&&!!q.choices[sel].correct; (q.isCorrect?SFX.correct:SFX.incorrect)(); renderStage(); }

  function gradeAll(){ QUESTIONS.forEach(q=>{ if(!q.isGraded){ q.isGraded=true; const sel=q.userChoice; q.isCorrect=(sel!==null)&&!!q.choices[sel]&&!!q.choices[sel].correct; } }); renderStage(); showResultsModal(); }
  function score(){ return QUESTIONS.reduce((acc,q)=> acc+(q.isCorrect?1:0), 0); }
  function updateScoreChip(){ const s=score(); const total=QUESTIONS.length; const pct=Math.round(100*s/total); document.getElementById('scoreChip').textContent='Puntaje: '+s+'/'+total+' ('+pct+'%)'; }

  const TEACHER_EMAIL='veitmeza@gmail.com';
  const TEACHER_PHONE='+56961410052';
  const REPORT_ENDPOINT='';

  function buildReport(){ const total=QUESTIONS.length; const correct=score(); const incorrect=total-correct; const pct=Math.round(100*correct/total); const perQ=QUESTIONS.map((q,i)=>({ n:i+1, context:q.context, skill:q.skill, stem:q.stem, answer:q.userChoice!==null? q.choices[q.userChoice].text:null, correct:q.choices.find(c=>c.correct).text, isCorrect:q.isCorrect })); return { total, correct, incorrect, pct, perQ }; }
  function buildReportText(name){ const dt=new Date().toLocaleString('es-CL'); const r=buildReport(); const lines=[ 'Resultados Quiz - Funciones Lineales y Afines', 'Estudiante: '+(name||'(sin nombre)'), 'Fecha: '+dt, 'Puntaje: '+r.correct+'/'+r.total+' ('+r.pct+'%)', 'Correctas: '+r.correct+' | Incorrectas: '+r.incorrect, '', 'Detalle por pregunta:' ]; r.perQ.forEach(x=>{ lines.push(x.n+'. ['+x.context+'/'+x.skill+']'); lines.push('   Enunciado: '+x.stem); lines.push('   Respuesta: '+(x.answer||'—')); lines.push('   Correcta: '+x.correct); lines.push('   Resultado: '+(x.isCorrect?'CORRECTA':'INCORRECTA')); }); return lines.join('
'); }

  function showResultsModal(){ const total=QUESTIONS.length; const correct=score(); const incorrect=total-correct; const pctOK=Math.round(100*correct/total); const pctBad=100-pctOK; const body=document.getElementById('modalBody'); body.innerHTML='<div class="stat"><strong>Correctas</strong><span>'+correct+'/'+total+' ('+pctOK+'%)</span></div><div class="stat"><strong>Incorrectas</strong><span>'+incorrect+'/'+total+' ('+pctBad+'%)</span></div>'; document.getElementById('modalOv').style.display='flex'; }
  function hideResultsModal(){ document.getElementById('modalOv').style.display='none'; }

  async function sendResults(){ const name=(document.getElementById('studentName')&&document.getElementById('studentName').value||'').trim(); if(!name){ alert('Ingresa el nombre del estudiante.'); return; } const reportText=buildReportText(name); if(REPORT_ENDPOINT){ try{ const res=await fetch(REPORT_ENDPOINT,{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, report: buildReport(), reportText })}); if(!res.ok) throw new Error('HTTP '+res.status); alert('Resultados enviados al profesor (endpoint).'); return; }catch(e){ console.warn('POST falló, se usará mailto:', e); } } const subject=encodeURIComponent('Resultados Quiz - '+name); const body=encodeURIComponent(reportText); const href='mailto:'+encodeURIComponent(TEACHER_EMAIL)+'?subject='+subject+'&body='+body; window.location.href=href; }
  function sendWhatsApp(){ const name=(document.getElementById('studentName')&&document.getElementById('studentName').value||'').trim(); if(!name){ alert('Ingresa el nombre del estudiante.'); return; } const txt=buildReportText(name); const phone=TEACHER_PHONE.replace(/[^0-9]/g,''); const url='https://wa.me/'+phone+'?text='+encodeURIComponent(txt); window.open(url,'_blank'); }
  function sendSMS(){ const name=(document.getElementById('studentName')&&document.getElementById('studentName').value||'').trim(); if(!name){ alert('Ingresa el nombre del estudiante.'); return; } const txt=buildReportText(name); const url='sms:'+TEACHER_PHONE+'?body='+encodeURIComponent(txt); window.location.href=url; }
  async function copyResults(){ const name=(document.getElementById('studentName')&&document.getElementById('studentName').value||'').trim(); const reportText=buildReportText(name); try{ await navigator.clipboard.writeText(reportText); alert('Resumen copiado.'); }catch(e){ console.warn(e); }

  function startQuiz(){ seedQuiz(); current=0; renderStage(); }
  function restart(){ hideResultsModal(); startQuiz(); }

  function bind(){ document.getElementById('btnEnviar').addEventListener('click', gradeAll);
    document.getElementById('btnReiniciar').addEventListener('click', ()=>{ SFX.click(); restart(); });
    document.getElementById('btnPrev').addEventListener('click', ()=>{ SFX.click(); goTo(current-1); });
    document.getElementById('btnNext').addEventListener('click', ()=>{ SFX.click(); goTo(current+1); });
    document.getElementById('btnRevisar').addEventListener('click', revisarActual);

    document.getElementById('btnCloseModal').addEventListener('click', ()=>{ SFX.click(); hideResultsModal(); });
    document.getElementById('btnSend').addEventListener('click', sendResults);
    document.getElementById('btnCopy').addEventListener('click', copyResults);
    document.getElementById('btnWA').addEventListener('click', sendWhatsApp);
    document.getElementById('btnSMS').addEventListener('click', sendSMS);

    wireSfx();
  }

  document.addEventListener('DOMContentLoaded', ()=>{ bind(); startQuiz(); });
  </script>
</body>
</html>
