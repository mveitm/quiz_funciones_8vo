<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz: Funciones Lineales y Afines</title>
    <!-- Carga de Tailwind CSS para un diseño limpio y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Definición de variables CSS para el tema oscuro */
        :root{ 
            --bg:#0b1020; --panel:#11182e; --muted:#9fb0d6; --text:#f2f5ff; 
            --accent:#4ea1ff; --warn:#ffd23f; --error:#ff6682; --ok:#53f29f; 
            --chip:#1b2544; --chip-hover:#25335d;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
        .chip { transition: all 0.2s; border-radius: 9999px; }
        .chip:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent); }
            50% { opacity: 0.8; box-shadow: 0 0 0 10px rgba(78, 161, 255, 0); }
        }
        /* Estilos específicos para la alternativa seleccionada */
        .choice-selected { 
            background-color: var(--accent) !important; 
            color: var(--bg) !important;
            font-weight: 600;
        }
        /* Estilos para el Toast (notificaciones) */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: var(--panel); color: var(--text);
            border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            opacity: 0; transition: opacity 0.5s, transform 0.5s; z-index: 1000;
        }
        .show-toast { opacity: 1 !important; transform: translate(-50%, 0) !important; }
        
        /* Estilo para la lista de alternativas, mejor en móvil */
        .choices-grid { display: grid; gap: 1rem; }
        @media (min-width: 640px) {
            .choices-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
    <script>
        // *****************************************************************************
        // ¡MANDATORIO! REEMPLAZA ESTA URL CON LA URL DE TU SCRIPT DE GOOGLE APP DESPLEGADO
        const REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbyE5oOh3FS1O817IacptIEd7pNQLNalsB-Bp92vghRqfaJIi-v3rZppbEnD4_cNQQiK/exec"; 
        // *****************************************************************************

        // Objeto de Estado Centralizado (SSM) para la robustez de la aplicación
        const STATE = {
            questions: [], // Array de preguntas
            current: 0,    // Índice de la pregunta actual (siempre inicializado a 0)
            isGraded: false, // Indica si el modo de revisión de resultados está activo
        };

        // -----------------------------------------------------------
        // 1. BANCO DE PREGUNTAS (13 Preguntas)
        // -----------------------------------------------------------
        function getQuestionBank() {
            return [
                {
                    text: "Si la función es f(x) = 3x - 5, ¿cuál es el valor de f(2)?",
                    choices: ["1", "3", "5", "6"],
                    correct: 0, // Índice 0: "1"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "¿Cuál es la pendiente (m) de la función lineal f(x) = -2x + 7?",
                    choices: ["7", "2", "-2", "0"],
                    correct: 2, // Índice 2: "-2"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "¿Qué tipo de función es f(x) = 5x?",
                    choices: ["Afín", "Constante", "Lineal", "Cuadrática"],
                    correct: 2, // Índice 2: "Lineal"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "El punto de corte con el eje Y (intercepto) de f(x) = 4x + 1 es:",
                    choices: ["(4, 0)", "(0, 1)", "(1, 0)", "(0, 4)"],
                    correct: 1, // Índice 1: "(0, 1)"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "Una función lineal siempre pasa por el punto:",
                    choices: ["(1, 0)", "(0, 1)", "(0, 0)", "(1, 1)"],
                    correct: 2, // Índice 2: "(0, 0)"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "Si la pendiente es 1/2, la función es:",
                    choices: ["Decreciente", "Creciente", "Constante", "Lineal pura"],
                    correct: 1, // Índice 1: "Creciente" (pendiente positiva)
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "¿Cuál es la ecuación de una función afín con pendiente -1 y ordenada al origen 3?",
                    choices: ["f(x) = x + 3", "f(x) = -x + 3", "f(x) = 3x - 1", "f(x) = -3x + 1"],
                    correct: 1, // Índice 1: "f(x) = -x + 3"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "Para f(x) = -x + 4, el valor de x cuando f(x) = 0 es:",
                    choices: ["-4", "4", "0", "1"],
                    correct: 1, // Índice 1: "4" (0 = -x + 4 => x = 4)
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "Si dos rectas tienen la misma pendiente, son:",
                    choices: ["Perpendiculares", "Secantes", "Paralelas", "Iguales"],
                    correct: 2, // Índice 2: "Paralelas"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "La función que modela el costo fijo de $10 y un costo variable de $2 por unidad es:",
                    choices: ["C(x) = 10x + 2", "C(x) = 2x + 10", "C(x) = 12x", "C(x) = 10"],
                    correct: 1, // Índice 1: "C(x) = 2x + 10"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "¿Qué representa la 'n' en la forma f(x) = mx + n?",
                    choices: ["La pendiente", "La variable dependiente", "El intercepto con Y", "La variable independiente"],
                    correct: 2, // Índice 2: "El intercepto con Y"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "Una función se llama 'constante' si su gráfica es una línea:",
                    choices: ["Vertical", "Diagonal", "Horizontal", "Curva"],
                    correct: 2, // Índice 2: "Horizontal" (m=0)
                    userChoice: null, isCorrect: null, isGraded: false,
                },
                {
                    text: "La función identidad f(x) = x, tiene pendiente:",
                    choices: ["0", "1", "-1", "Indefinida"],
                    correct: 1, // Índice 1: "1"
                    userChoice: null, isCorrect: null, isGraded: false,
                },
            ];
        }

        // -----------------------------------------------------------
        // 2. LÓGICA DE ESTADO Y FLUJO
        // -----------------------------------------------------------

        /**
         * Inicializa o restablece el estado de la aplicación.
         * Previene el error de inicialización al asegurar que QUESTIONS siempre está lleno.
         */
        function initializeState() {
            // Llenar el estado con las preguntas
            STATE.questions = getQuestionBank();
            STATE.current = 0;
            STATE.isGraded = false;
        }

        /**
         * Maneja la selección de una alternativa.
         * @param {number} choiceIndex - Índice de la alternativa seleccionada.
         */
        function selectChoice(choiceIndex) {
            if (STATE.isGraded) return; // No permitir cambios si ya se calificó

            const question = STATE.questions[STATE.current];
            question.userChoice = choiceIndex;

            // Resaltar el botón Resultados si es la última pregunta y está respondida
            if (STATE.current === STATE.questions.length - 1) {
                const isAllAnswered = STATE.questions.every(q => q.userChoice !== null);
                const btnEnviar = document.getElementById('btnEnviar');
                if (isAllAnswered) {
                    btnEnviar.classList.add('pulse', 'bg-warn/90');
                } else {
                    btnEnviar.classList.remove('pulse', 'bg-warn/90');
                }
            }
            
            // Re-renderizar la etapa para reflejar la selección
            renderStage();
        }

        /**
         * Navega a la pregunta anterior o siguiente.
         * @param {number} offset - 1 para siguiente, -1 para anterior.
         */
        function navigate(offset) {
            const newIndex = STATE.current + offset;

            if (newIndex >= 0 && newIndex < STATE.questions.length) {
                STATE.current = newIndex;
                renderStage();
            }
        }
        
        /**
         * Cuenta las respuestas correctas.
         * Aplica la calificación si no se ha hecho antes.
         * @returns {number} Número de respuestas correctas.
         */
        function countAndGrade() {
            let correctCount = 0;
            STATE.questions.forEach(q => {
                // Calificar internamente si no está calificado
                if (!q.isGraded) {
                    q.isCorrect = q.userChoice === q.correct;
                    q.isGraded = true;
                }
                if (q.isCorrect) {
                    correctCount++;
                }
            });
            return correctCount;
        }


        // -----------------------------------------------------------
        // 3. RENDERIZADO DEL UI (Actualización del DOM)
        // -----------------------------------------------------------

        /**
         * Renderiza el contenido de la etapa (pregunta y alternativas).
         */
        function renderStage() {
            // GUARD: Previene errores si el estado no está listo
            if (STATE.questions.length === 0) {
                document.getElementById('stage').innerHTML = '<p class="text-center text-muted">Cargando preguntas...</p>';
                return;
            }

            const currentQ = STATE.questions[STATE.current];
            const stageEl = document.getElementById('stage');
            
            // 1. Renderizar la pregunta
            stageEl.innerHTML = `
                <div class="text-xl font-bold mb-6 text-text">
                    ${STATE.current + 1}. ${currentQ.text}
                </div>
            `;
            
            // 2. Crear el contenedor de alternativas
            const choicesContainer = document.createElement('div');
            choicesContainer.className = 'choices-grid';
            
            // 3. Renderizar alternativas
            currentQ.choices.forEach((choiceText, index) => {
                const isSelected = currentQ.userChoice === index;
                
                // Clases base para el chip de alternativa
                let choiceClasses = "chip p-4 border-2 cursor-pointer transition duration-300 shadow-lg text-center font-medium ";
                let borderColor = 'border-chip';
                let bgColor = 'bg-chip';
                let textColor = 'text-text';

                // Modo Calificado (isGraded)
                if (STATE.isGraded) {
                    if (index === currentQ.correct) {
                        // Respuesta Correcta
                        choiceClasses += " border-ok bg-ok/10 text-ok";
                        if (isSelected) {
                            choiceClasses += " choice-selected"; // Resalta si es la correcta y la escogió
                        }
                    } else if (isSelected && !currentQ.isCorrect) {
                        // Respuesta Incorrecta seleccionada por el usuario
                        choiceClasses += " border-error bg-error/10 text-error";
                    } else {
                        // Alternativa no seleccionada y no es la correcta
                        choiceClasses += " border-chip bg-chip/50 text-muted";
                    }
                } 
                // Modo Normal (isGraded = false)
                else {
                    if (isSelected) {
                        choiceClasses += " choice-selected border-accent bg-accent/90 text-bg shadow-lg";
                    } else {
                        choiceClasses += " border-chip bg-chip hover:bg-chip-hover";
                    }
                }

                const choiceEl = document.createElement('div');
                choiceEl.className = choiceClasses;
                choiceEl.textContent = choiceText;
                choiceEl.setAttribute('data-index', index);
                
                // Adjuntar listener solo si no está calificado
                if (!STATE.isGraded) {
                    choiceEl.onclick = () => selectChoice(index);
                }
                
                choicesContainer.appendChild(choiceEl);
            });
            
            stageEl.appendChild(choicesContainer);
            
            // 4. Actualizar el mapa de navegación y botones
            renderMapAndButtons();
        }

        /**
         * Renderiza el mapa de navegación inferior y actualiza la visibilidad de botones.
         */
        function renderMapAndButtons() {
            const mapContainer = document.getElementById('mapa');
            mapContainer.innerHTML = '';
            
            // Generar los chips de navegación
            STATE.questions.forEach((q, index) => {
                const chip = document.createElement('div');
                let chipClasses = 'chip text-xs px-3 py-1 cursor-pointer font-bold transition duration-150 ';
                
                if (index === STATE.current) {
                    chipClasses += 'bg-accent text-bg shadow-xl';
                } else if (q.userChoice !== null) {
                    chipClasses += 'bg-chip-hover text-text hover:bg-accent/50';
                } else {
                    chipClasses += 'bg-chip text-muted hover:bg-chip-hover';
                }
                
                if (STATE.isGraded) {
                    if (q.isCorrect) chipClasses = chipClasses.replace(/bg-.*/, 'bg-ok/70 text-bg');
                    else if (q.userChoice !== null) chipClasses = chipClasses.replace(/bg-.*/, 'bg-error/70 text-bg');
                }

                chip.className = chipClasses;
                chip.textContent = index + 1;
                chip.onclick = () => { STATE.current = index; renderStage(); };
                mapContainer.appendChild(chip);
            });

            // Actualizar botones de navegación
            document.getElementById('btnPrev').disabled = STATE.current === 0;
            document.getElementById('btnNext').disabled = STATE.current === STATE.questions.length - 1;
            
            // Actualizar botón de Enviar/Resultados
            const btnEnviar = document.getElementById('btnEnviar');
            const isAllAnswered = STATE.questions.every(q => q.userChoice !== null);

            if (STATE.isGraded) {
                // Modo Calificado: Se muestra el botón de Reiniciar
                btnEnviar.textContent = 'Reiniciar Quiz';
                btnEnviar.classList.remove('bg-warn/90', 'pulse');
                btnEnviar.classList.add('bg-accent');
                btnEnviar.onclick = restartQuiz;
            } else {
                // Modo Normal: Mostrar "Resultados" solo si está todo respondido
                btnEnviar.textContent = 'Resultados';
                btnEnviar.classList.remove('bg-accent');
                btnEnviar.classList.toggle('bg-warn/90', isAllAnswered);
                btnEnviar.classList.toggle('pulse', isAllAnswered);
                btnEnviar.classList.toggle('opacity-50', !isAllAnswered);
                btnEnviar.disabled = !isAllAnswered;
                btnEnviar.onclick = showResults;
            }
        }

        // -----------------------------------------------------------
        // 4. FUNCIONALIDAD PRINCIPAL
        // -----------------------------------------------------------

        /**
         * Muestra los resultados finales, califica el quiz y activa el modo de revisión.
         */
        function showResults() {
            if (STATE.isGraded) return; // Evitar doble calificación

            const isAllAnswered = STATE.questions.every(q => q.userChoice !== null);
            if (!isAllAnswered) {
                showToast('¡Debes responder todas las 13 preguntas antes de ver los resultados!', 'warn');
                return;
            }

            const correctCount = countAndGrade();
            const totalQuestions = STATE.questions.length;
            const percentage = ((correctCount / totalQuestions) * 100).toFixed(1);
            
            // Activar el modo de revisión
            STATE.isGraded = true;
            STATE.current = 0; // Volver a la primera pregunta para revisión

            // Generar el reporte de texto
            const reportText = generateReport(correctCount, totalQuestions, percentage);
            
            // Mostrar resumen
            showSummaryModal(reportText.summaryHTML);

            // Intentar enviar el reporte por correo
            sendReportEmail(reportText.rawText, correctCount, totalQuestions)
                .then(() => showToast('Resultados enviados por correo ✅', 'ok'))
                .catch(() => showToast('Error al enviar el reporte. Revisa la URL del Apps Script.', 'error'));

            // Renderizar la UI en modo calificado
            renderStage();
        }

        /**
         * Reinicia el quiz al estado inicial.
         */
        function restartQuiz() {
            if (!confirm('¿Estás seguro de que quieres reiniciar el Quiz? Se perderán los resultados actuales.')) {
                return;
            }
            initializeState();
            renderStage();
            hideModal();
            showToast('Quiz Reiniciado. ¡Mucha suerte!', 'accent');
        }


        // -----------------------------------------------------------
        // 5. HERRAMIENTAS Y UTILIDADES
        // -----------------------------------------------------------

        /**
         * Muestra un mensaje temporal (Toast).
         * @param {string} message - Mensaje a mostrar.
         * @param {('ok'|'error'|'warn'|'accent')} type - Tipo de mensaje para color.
         */
        let toastTimeout;
        function showToast(message, type = 'accent') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.backgroundColor = `var(--${type})`;
            toast.style.color = type === 'accent' ? 'var(--bg)' : 'var(--text)';
            
            toast.classList.add('show-toast');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show-toast');
            }, 3000);
        }

        /**
         * Genera el reporte en formato HTML (para el modal) y texto plano (para el email).
         * @returns {{summaryHTML: string, rawText: string}} Reporte.
         */
        function generateReport(correctCount, totalQuestions, percentage) {
            let summaryHTML = `<h2 class="text-3xl font-extrabold mb-2">Resultados Finales</h2>`;
            summaryHTML += `<p class="text-xl mb-4">Correctas: <span class="text-ok font-bold">${correctCount}</span> de <span class="font-bold">${totalQuestions}</span></p>`;
            summaryHTML += `<p class="text-4xl font-black mb-6" style="color:var(--accent)">Nota: ${percentage}%</p>`;

            let rawText = `[REPORTE QUIZ FUNCIONES LINEALES Y AFINES]\n`;
            rawText += `Nota Final: ${percentage}% (${correctCount}/${totalQuestions})\n\n`;

            STATE.questions.forEach((q, index) => {
                const status = q.isCorrect ? 'CORRECTA' : 'INCORRECTA';
                const userChoiceText = q.userChoice !== null ? q.choices[q.userChoice] : 'No Respondida';
                const correctChoiceText = q.choices[q.correct];

                rawText += `--- Pregunta ${index + 1} (${status}) ---\n`;
                rawText += `Pregunta: ${q.text}\n`;
                rawText += `Tu Respuesta: ${userChoiceText}\n`;
                if (!q.isCorrect) {
                    rawText += `Respuesta Correcta: ${correctChoiceText}\n`;
                }
                rawText += `\n`;
            });
            
            rawText += `\n--- FIN DEL DETALLE ---\n`;

            return { summaryHTML, rawText };
        }
        
        /**
         * Muestra la ventana modal de resultados.
         * @param {string} contentHTML - Contenido HTML del modal.
         */
        function showSummaryModal(contentHTML) {
            document.getElementById('modal-content').innerHTML = contentHTML + 
                '<p class="mt-8 text-center"><button onclick="hideModal()" class="bg-accent text-bg font-bold py-3 px-6 rounded-lg transition hover:bg-accent/80">Revisar Respuestas</button></p>';
            document.getElementById('modal').classList.remove('hidden');
        }
        
        /**
         * Oculta la ventana modal.
         */
        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        /**
         * Envía el reporte por correo a través de Google Apps Script.
         * Usa 'fetch' con FormData para manejar el envío de datos.
         * @param {string} report - Texto plano del reporte.
         * @param {number} correctas - Cantidad de respuestas correctas.
         * @param {number} total - Cantidad total de preguntas.
         * @returns {Promise<void>}
         */
        async function sendReportEmail(report, correctas, total) {
            try {
                const formData = new FormData();
                formData.append('reporte', report);
                formData.append('correctas', correctas);
                formData.append('total', total);

                const response = await fetch(REPORT_ENDPOINT, {
                    method: 'POST',
                    body: formData, // FormData es compatible con form-urlencoded que espera GAS
                    // No especificar 'Content-Type' para que el navegador lo defina
                });

                // GAS con CORS devuelve una respuesta válida que podemos chequear
                const result = await response.json();

                if (result.status === "success") {
                    return Promise.resolve();
                } else {
                    console.error("Error del Servidor GAS:", result.message);
                    return Promise.reject(new Error(result.message));
                }

            } catch (error) {
                console.error("Error de red o CORS al enviar reporte:", error);
                // Aquí el error puede ser que la URL está mal o el CORS falló
                return Promise.reject(error);
            }
        }

        // -----------------------------------------------------------
        // 6. INICIALIZACIÓN DE LA APLICACIÓN
        // -----------------------------------------------------------
        
        /**
         * Función de arranque principal.
         */
        function initApp() {
            console.log("Iniciando Quiz App...");
            initializeState();
            
            // Asignar listeners a los botones de navegación una sola vez
            document.getElementById('btnPrev').onclick = () => navigate(-1);
            document.getElementById('btnNext').onclick = () => navigate(1);
            
            // El botón de enviar/resultados se actualiza en renderMapAndButtons()
            
            // El core de la aplicación: renderizar la etapa inicial
            renderStage();
            console.log("Quiz cargado exitosamente. Total de preguntas:", STATE.questions.length);
            showToast('Quiz de 13 Preguntas: Funciones Lineales y Afines', 'accent');
        }

        // Arranque estricto después de que el DOM esté completamente cargado
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Encabezado Fijo -->
    <header class="bg-panel shadow-2xl sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-accent">Quiz Matemáticas</h1>
            <div class="badge text-sm font-semibold">
                Funciones Lineales y Afines
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow p-4 md:p-8">
        <div class="max-w-4xl mx-auto bg-panel p-6 md:p-10 rounded-xl shadow-2xl border border-white/10">
            
            <!-- Contenedor de la Pregunta y Alternativas -->
            <div id="stage" class="min-h-[250px] flex flex-col justify-center">
                <!-- El contenido de la pregunta y alternativas se inyecta aquí -->
                <p class="text-center text-muted">Cargando...</p>
            </div>
            
            <!-- Barra de Navegación del Quiz -->
            <div class="mt-8 pt-6 border-t border-white/10">
                
                <!-- Mapa de Navegación (Chips) -->
                <div id="mapa" class="flex flex-wrap justify-center gap-2 mb-6">
                    <!-- Los chips de navegación se inyectan aquí -->
                </div>

                <!-- Botones de Control -->
                <div class="flex justify-between items-center gap-4">
                    <button id="btnPrev" class="bg-chip text-text p-3 rounded-xl font-bold transition duration-200 hover:bg-chip-hover disabled:opacity-50" disabled>
                        &#9664; Anterior
                    </button>
                    
                    <button id="btnEnviar" class="bg-warn text-bg p-3 rounded-xl font-extrabold transition duration-200 hover:opacity-80 disabled:opacity-50">
                        Resultados
                    </button>
                    
                    <button id="btnNext" class="bg-chip text-text p-3 rounded-xl font-bold transition duration-200 hover:bg-chip-hover disabled:opacity-50">
                        Siguiente &#9654;
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Toast (Notificación) -->
    <div id="toast" role="alert" class="bg-accent text-bg"></div>

    <!-- Modal de Resultados -->
    <div id="modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden p-4" onclick="hideModal()">
        <div class="bg-panel p-8 md:p-10 rounded-xl shadow-2xl max-w-lg w-full text-center" onclick="event.stopPropagation()">
            <div id="modal-content">
                <!-- Contenido del resumen de resultados -->
            </div>
        </div>
    </div>
</body>
</html>
